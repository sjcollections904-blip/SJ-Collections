<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" fill="none" role="img" aria-label="SJ Collections Logo" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <!-- Monogram SJ: Classic Roman Serif high-contrast lettering -->
  <g fill="#1A1A1A" transform="translate(160, 32)">
    <!-- Letter S -->
    <path d="M -11 -20 C -6 -20 -1 -17 1 -13 L -3 -10 C -5 -13 -8 -15 -11 -15 C -17 -15 -21 -11 -21 -5 C -21 7 -5 7 -5 16 C -5 23 -11 27 -18 27 C -23 27 -29 24 -32 19 L -27 16 C -25 20 -21 22 -17 22 C -11 22 -7 18 -7 13 C -7 2 -23 2 -23 -9 C -23 -16 -17 -20 -11 -20 Z" />
    
    <!-- Letter J interlocking with S -->
    <path d="M 12 -20 L 26 -20 L 26 -16 L 20 -16 L 20 15 C 20 22 15 27 6 27 C -1 27 -7 23 -9 18 L -4 15 C -2 18 1 21 6 21 C 11 21 14 18 14 13 L 14 -16 L 7 -16 L 7 -20 Z" />
    
    <!-- Serif foot / finial accent for J -->
    <circle cx="6" cy="24" r="1.5" />
  </g>

  <!-- Understated hairline divider -->
  <line x1="70" y1="67" x2="250" y2="67" stroke="#1A1A1A" stroke-width="0.8" opacity="0.9" />

  <!-- Widely spaced COLLECTIONS lettering -->
  <text x="160" y="80" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" fill="#1A1A1A" letter-spacing="0.45em" text-anchor="middle">COLLECTIONS</text>
</svg>
